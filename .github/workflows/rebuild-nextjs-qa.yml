name: rebuild-nextjs QA

on:
  push:
    branches: [rebuild-nextjs]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git diff --check HEAD^ HEAD
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:notifications
      - run: npm run validate:mobile-performance
      - run: npm run validate:launch-baseline
      - run: npm run validate:monitoring
      - run: npm run validate:commerce-e2e
      - run: npm run validate:checkout-expiry-race
      - run: npm run validate:payout-recovery
      - run: npm run validate:android-rc
      - run: npm run validate:public-contact
      - run: npm run validate:account-deletion-e2e
      - run: npm run validate:production-origin
      - run: npm run validate:production-env
      - run: npm run validate:beta-feedback
      - run: npm run validate:seller-read-policy
      - run: npm run build

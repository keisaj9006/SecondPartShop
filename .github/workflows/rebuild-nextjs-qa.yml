name: rebuild-nextjs QA

on:
  push:
    branches: [rebuild-nextjs]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ci_placeholder
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: git diff --check HEAD^ HEAD
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate:notifications
      - run: npm run validate:mobile-performance
      - run: npm run validate:launch-baseline
      - run: npm run validate:monitoring
      - run: npm run validate:commerce-e2e
      - run: npm run validate:checkout-expiry-race
      - run: npm run validate:payout-recovery
      - run: npm run validate:android-rc
      - run: npm run validate:public-contact
      - run: npm run validate:account-deletion-e2e
      - run: npm run validate:production-origin
      - run: npm run validate:production-env
      - run: npm run validate:beta-feedback
      - run: npm run validate:seller-read-policy
      - run: npm run build

  last-stock-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secondpart_rc_password
          POSTGRES_DB: secondpart_rc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d secondpart_rc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Run true two-connection last-stock race
        env:
          TEST_DATABASE_URL: postgresql://postgres:secondpart_rc_password@127.0.0.1:5432/secondpart_rc
        run: node scripts/verify-last-stock-concurrency-postgres.mjs

  marketplace-scale-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secondpart_scale_password
          POSTGRES_DB: secondpart_scale
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d secondpart_scale"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify PostgreSQL client
        run: psql --version
      - name: Run isolated 100k marketplace search proof
        env:
          TEST_DATABASE_URL: postgresql://postgres:secondpart_scale_password@127.0.0.1:5432/secondpart_scale
        run: node scripts/verify-marketplace-scale-postgres.mjs
      - name: Compare candidate scan strategies
        env:
          TEST_DATABASE_URL: postgresql://postgres:secondpart_scale_password@127.0.0.1:5432/secondpart_scale
        run: node scripts/diagnose-marketplace-candidate-strategies.mjs
      - name: Apply and verify single-scan search patch
        env:
          TEST_DATABASE_URL: postgresql://postgres:secondpart_scale_password@127.0.0.1:5432/secondpart_scale
        run: node scripts/verify-marketplace-single-scan-postgres.mjs
  dispute-reversal-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: secondpart_dispute_test_password
          POSTGRES_DB: secondpart_dispute_rc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d secondpart_dispute_rc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install isolated PostgreSQL test client
        run: npm install --prefix "$RUNNER_TEMP/dispute-pg" --ignore-scripts --no-audit --no-fund pg@8.16.3
      - name: Prove claim and terminal outcome serialization
        env:
          TEST_DATABASE_URL: postgresql://postgres:secondpart_dispute_test_password@127.0.0.1:5432/secondpart_dispute_rc
          PG_CLIENT_MODULE: ${{ runner.temp }}/dispute-pg/node_modules/pg/lib/index.js
        run: node scripts/verify-dispute-reversal-concurrency-postgres.mjs

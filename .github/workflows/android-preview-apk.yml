name: Android Preview APK

on:
  workflow_dispatch:
  push:
    branches: [rebuild-nextjs]
    paths:
      - "mobile-shell/**"
      - "mobile-native-src/**"
      - "capacitor.config.json"
      - "scripts/patch-android-mobile.mjs"
      - "scripts/prepare-android-preview.mjs"
      - ".github/workflows/android-preview-apk.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android-preview:
    name: Build SecondPart Android Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8 toolchain and native plugins
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@8.5.1 \
            @capacitor/cli@8.5.1 \
            @capacitor/android@8.5.1 \
            @capacitor/app@8.1.1 \
            @capacitor/browser@8.0.4 \
            @capacitor/camera@8.2.4 \
            @capacitor/push-notifications@8.0.4 \
            @aparajita/capacitor-secure-storage@8.0.0 \
            esbuild@0.25.9
          npm pkg set "dependencies.@capacitor/app=8.1.1"
          npm pkg set "dependencies.@capacitor/browser=8.0.4"
          npm pkg set "dependencies.@capacitor/camera=8.2.4"
          npm pkg set "dependencies.@capacitor/push-notifications=8.0.4"
          npm pkg set "dependencies.@aparajita/capacitor-secure-storage=8.0.0"

      - name: Prepare full Next.js frontend for Android Preview
        env:
          SECOND_PART_PREVIEW_URL: https://second-part-shop-preview.vercel.app
        run: node scripts/prepare-android-preview.mjs

      - name: Build native JavaScript bridge
        run: npx esbuild mobile-native-src/native.ts --bundle --platform=browser --format=iife --target=es2020 --outfile=mobile-shell/native.js

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore stable preview signing key
        env:
          ANDROID_PREVIEW_KEYSTORE_BASE64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_PREVIEW_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_PREVIEW_KEYSTORE_BASE64 is missing. Refusing to build an APK with an ephemeral signing key."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          echo "$ANDROID_PREVIEW_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          keytool -list -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey >/dev/null
          echo "Preview signer:"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Owner:" | head -n 2

      - name: Generate Android project
        run: npx cap add android

      - name: Patch Android deep links
        run: node scripts/patch-android-mobile.mjs

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Verify Preview uses full frontend
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const config=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
          if(config.server?.url!=="https://second-part-shop-preview.vercel.app"){
            throw new Error("Android Preview is not pointed at the full Next.js frontend.");
          }
          console.log("Android Preview frontend:",config.server.url);
          NODE

      - name: Configure Firebase services for preview
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          else
            node scripts/write-ci-google-services.mjs
          fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK signer
        run: |
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk

          EXPECTED="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$("$APKSIGNER" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"

          echo "Expected signer SHA-256: $EXPECTED"
          echo "APK signer SHA-256:      $ACTUAL"

          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::APK signer does not match the persistent SecondPart Preview signing key."
            exit 1
          fi

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SecondPart-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecondPart-Android-Preview-Manual
          path: SecondPart-preview.apk
          if-no-files-found: error
          retention-days: 14

name: Android Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild-nextjs
    paths:
      - "capacitor.config.json"
      - "mobile-shell/**"
      - "mobile-native-src/**"
      - "scripts/patch-android-mobile.mjs"
      - ".github/workflows/android-preview-apk.yml"
      - ".github/android-preview-debug.keystore"

permissions:
  contents: read

jobs:
  build-android-preview:
    name: Build SecondPart Android Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8 toolchain and native plugins
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@8.5.1 \
            @capacitor/cli@8.5.1 \
            @capacitor/android@8.5.1 \
            @capacitor/app@8.1.1 \
            @capacitor/browser@8.0.4 \
            @capacitor/camera@8.2.4 \
            @aparajita/capacitor-secure-storage@8.0.0 \
            esbuild@0.25.9
          npm pkg set "dependencies.@capacitor/app=8.1.1"
          npm pkg set "dependencies.@capacitor/browser=8.0.4"
          npm pkg set "dependencies.@capacitor/camera=8.2.4"
          npm pkg set "dependencies.@aparajita/capacitor-secure-storage=8.0.0"

      - name: Build native JavaScript bridge
        run: npx esbuild mobile-native-src/native.ts --bundle --platform=browser --format=iife --target=es2020 --outfile=mobile-shell/native.js

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: npx cap add android

      - name: Patch Android deep links
        run: node scripts/patch-android-mobile.mjs

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Install stable preview debug keystore
        run: |
          mkdir -p "$HOME/.android"
          cp .github/android-preview-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SecondPart-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecondPart-Android-Preview-Stable
          path: SecondPart-preview.apk
          if-no-files-found: error
          retention-days: 14

name: Android Preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild-nextjs
    paths:
      - "capacitor.config.json"
      - "mobile-shell/**"
      - ".github/workflows/android-preview-apk.yml"

permissions:
  contents: read

jobs:
  build-android-preview:
    name: Build SecondPart Android Preview
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8 toolchain
        run: npm install --no-save --package-lock=false @capacitor/core@8.5.1 @capacitor/cli@8.5.1 @capacitor/android@8.5.1

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Prepare APK artifact
        run: cp android/app/build/outputs/apk/debug/app-debug.apk SecondPart-preview.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SecondPart-Android-Preview
          path: SecondPart-preview.apk
          if-no-files-found: error
          retention-days: 14

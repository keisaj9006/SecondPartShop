name: Android Production AAB

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Production HTTPS origin, e.g. https://secondpart.example"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-production-aab:
    name: Build signed SecondPart production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECOND_PART_PRODUCTION_URL: ${{ inputs.production_url }}
      SECOND_PART_KEYSTORE_PATH: /tmp/secondpart-release.jks
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate release inputs and secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          node -e 'const u=new URL(process.env.SECOND_PART_PRODUCTION_URL); if(u.protocol!=="https:") process.exit(1)'
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8 toolchain and native plugins
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@8.5.1 \
            @capacitor/cli@8.5.1 \
            @capacitor/android@8.5.1 \
            @capacitor/app@8.1.1 \
            @capacitor/browser@8.0.4 \
            @capacitor/camera@8.2.4 \
            @aparajita/capacitor-secure-storage@8.0.0 \
            esbuild@0.25.9
          npm pkg set "dependencies.@capacitor/app=8.1.1"
          npm pkg set "dependencies.@capacitor/browser=8.0.4"
          npm pkg set "dependencies.@capacitor/camera=8.2.4"
          npm pkg set "dependencies.@aparajita/capacitor-secure-storage=8.0.0"

      - name: Prepare isolated production config
        run: node scripts/prepare-android-release.mjs

      - name: Build native JavaScript bridge
        run: npx esbuild mobile-native-src/native.ts --bundle --platform=browser --format=iife --target=es2020 --outfile=mobile-shell/native.js

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Android project
        run: npx cap add android

      - name: Patch Android deep links
        run: |
          node scripts/patch-android-mobile.mjs
          node scripts/patch-android-app-links.mjs

      - name: Sync Capacitor project
        run: npx cap sync android

      - name: Restore release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$SECOND_PART_KEYSTORE_PATH"

      - name: Configure release signing
        run: node scripts/patch-android-release-signing.mjs

      - name: Build signed Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Prepare AAB artifact
        run: cp android/app/build/outputs/bundle/release/app-release.aab SecondPart-production.aab

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SecondPart-Android-Production-AAB
          path: SecondPart-production.aab
          if-no-files-found: error
          retention-days: 14

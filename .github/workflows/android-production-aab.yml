name: Android Production AAB

on:
  workflow_dispatch:
    inputs:
      production_url:
        description: "Production HTTPS URL loaded by the native app"
        required: true
        type: string
      version_name:
        description: "Android version name, e.g. 1.0.0"
        required: true
        default: "1.0.0"
        type: string
      version_code:
        description: "Monotonically increasing Android version code"
        required: true
        default: "1"
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-production-aab:
    name: Build signed SecondPart production AAB
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECOND_PART_PRODUCTION_URL: ${{ inputs.production_url }}
      SECOND_PART_VERSION_NAME: ${{ inputs.version_name }}
      SECOND_PART_VERSION_CODE: ${{ inputs.version_code }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8 toolchain and native plugins
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@8.5.1 \
            @capacitor/cli@8.5.1 \
            @capacitor/android@8.5.1 \
            @capacitor/app@8.1.1 \
            @capacitor/browser@8.0.4 \
            @capacitor/camera@8.2.4 \
            @capacitor/push-notifications@8.0.4 \
            @aparajita/capacitor-secure-storage@8.0.0 \
            esbuild@0.25.9
          npm pkg set "dependencies.@capacitor/app=8.1.1"
          npm pkg set "dependencies.@capacitor/browser=8.0.4"
          npm pkg set "dependencies.@capacitor/camera=8.2.4"
          npm pkg set "dependencies.@capacitor/push-notifications=8.0.4"
          npm pkg set "dependencies.@aparajita/capacitor-secure-storage=8.0.0"

      - name: Prepare full production frontend
        run: node scripts/prepare-android-production.mjs

      - name: Build native JavaScript bridge
        run: npx esbuild mobile-native-src/native.ts --bundle --platform=browser --format=iife --target=es2020 --outfile=mobile-shell/native.js

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore production upload key
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_RELEASE_KEYSTORE_BASE64" ] || [ -z "$ANDROID_RELEASE_STORE_PASSWORD" ] || [ -z "$ANDROID_RELEASE_KEY_ALIAS" ] || [ -z "$ANDROID_RELEASE_KEY_PASSWORD" ]; then
            echo "::error::Production Android signing secrets are incomplete."
            exit 1
          fi
          export SECOND_PART_RELEASE_KEYSTORE="$RUNNER_TEMP/secondpart-release.jks"
          echo "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$SECOND_PART_RELEASE_KEYSTORE"
          keytool -list -keystore "$SECOND_PART_RELEASE_KEYSTORE" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" >/dev/null
          echo "SECOND_PART_RELEASE_KEYSTORE=$SECOND_PART_RELEASE_KEYSTORE" >> "$GITHUB_ENV"

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Patch production Android release
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          node scripts/patch-android-production.mjs
          node scripts/patch-android-app-links.mjs

      - name: Configure production Firebase services
        env:
          GOOGLE_SERVICES_JSON_BASE64_PRODUCTION: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64_PRODUCTION }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64_PRODUCTION" ]; then
            echo "::error::GOOGLE_SERVICES_JSON_BASE64_PRODUCTION is required for com.secondpart.marketplace."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON_BASE64_PRODUCTION" | base64 --decode > android/app/google-services.json

      - name: Verify production configuration
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const config=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
          if(config.appId!=="com.secondpart.marketplace")throw new Error("Wrong production appId.");
          if(config.loggingBehavior!=="none")throw new Error("Production logging must be disabled.");
          if(config.android?.webContentsDebuggingEnabled!==false)throw new Error("WebView debugging must be disabled.");
          if(!config.server?.url?.startsWith("https://"))throw new Error("Production frontend must use HTTPS.");
          if(/preview|localhost|127\.0\.0\.1/i.test(new URL(config.server.url).hostname))throw new Error("Production build points to a preview/local host.");
          const vars=fs.readFileSync("android/variables.gradle","utf8");
          if(!/compileSdkVersion\s*=\s*36/.test(vars)||!/targetSdkVersion\s*=\s*36/.test(vars))throw new Error("Android API 36 is required.");
          const gradle=fs.readFileSync("android/app/build.gradle","utf8");
          if(!gradle.includes("secondPartReleaseSigning"))throw new Error("Production release signing is not configured.");
          console.log("Production package:",config.appId);
          console.log("Production frontend:",config.server.url);
          NODE

      - name: Build signed Android App Bundle
        working-directory: android
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify AAB signature
        env:
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          EXPECTED="$(keytool -list -v -keystore "$SECOND_PART_RELEASE_KEYSTORE" -storepass "$ANDROID_RELEASE_STORE_PASSWORD" -alias "$ANDROID_RELEASE_KEY_ALIAS" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL="$(keytool -printcert -jarfile "$AAB" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Expected upload signer SHA-256: $EXPECTED"
          echo "AAB signer SHA-256:             $ACTUAL"
          if [ -z "$EXPECTED" ] || [ -z "$ACTUAL" ] || [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::AAB signer does not match the production upload key."
            exit 1
          fi

      - name: Prepare production artifact
        run: cp android/app/build/outputs/bundle/release/app-release.aab "SecondPart-${{ inputs.version_name }}-${{ inputs.version_code }}.aab"

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: SecondPart-Production-AAB-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: SecondPart-${{ inputs.version_name }}-${{ inputs.version_code }}.aab
          if-no-files-found: error
          retention-days: 30

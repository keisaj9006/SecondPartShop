name: Android Release Pipeline Check

on:
  workflow_dispatch:
  push:
    branches: [rebuild-nextjs]
    paths:
      - "mobile-shell/**"
      - "mobile-native-src/**"
      - "assets/android-production/**"
      - "capacitor.config.json"
      - "scripts/prepare-android-production.mjs"
      - "scripts/patch-android-production.mjs"
      - "scripts/patch-android-app-links.mjs"
      - "scripts/verify-android-brand-assets.mjs"
      - "scripts/write-ci-google-services.mjs"
      - ".github/workflows/android-production-aab.yml"
      - ".github/workflows/android-release-check.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release-bundle:
    name: Validate production-style AAB build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SECOND_PART_PRODUCTION_URL: https://release-check.secondpart.invalid
      SECOND_PART_VERSION_NAME: 1.0.0
      SECOND_PART_VERSION_CODE: 1
      SECOND_PART_RELEASE_KEYSTORE: /tmp/secondpart-ci-release.jks
      ANDROID_RELEASE_STORE_PASSWORD: changeit
      ANDROID_RELEASE_KEY_ALIAS: secondpart-ci
      ANDROID_RELEASE_KEY_PASSWORD: changeit

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install Capacitor 8 toolchain, assets and native plugins
        run: |
          npm install --no-save --package-lock=false \
            @capacitor/core@8.5.1 \
            @capacitor/cli@8.5.1 \
            @capacitor/android@8.5.1 \
            @capacitor/assets@3.0.5 \
            @capacitor/app@8.1.1 \
            @capacitor/browser@8.0.4 \
            @capacitor/camera@8.2.4 \
            @capacitor/push-notifications@8.0.4 \
            @aparajita/capacitor-secure-storage@8.0.0 \
            esbuild@0.25.9
          npm pkg set "dependencies.@capacitor/app=8.1.1"
          npm pkg set "dependencies.@capacitor/browser=8.0.4"
          npm pkg set "dependencies.@capacitor/camera=8.2.4"
          npm pkg set "dependencies.@capacitor/push-notifications=8.0.4"
          npm pkg set "dependencies.@aparajita/capacitor-secure-storage=8.0.0"

      - name: Prepare production-style config
        run: node scripts/prepare-android-production.mjs

      - name: Build native JavaScript bridge
        run: npx esbuild mobile-native-src/native.ts --bundle --platform=browser --format=iife --target=es2020 --outfile=mobile-shell/native.js

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate and sync Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate SecondPart launcher and splash assets
        run: |
          npx capacitor-assets generate --android \
            --assetPath assets/android-production \
            --iconBackgroundColor '#173c31' \
            --iconBackgroundColorDark '#173c31' \
            --splashBackgroundColor '#173c31' \
            --splashBackgroundColorDark '#173c31' \
            --logoSplashScale 0.18
          node scripts/verify-android-brand-assets.mjs

      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair -noprompt \
            -keystore "$SECOND_PART_RELEASE_KEYSTORE" \
            -storepass "$ANDROID_RELEASE_STORE_PASSWORD" \
            -keypass "$ANDROID_RELEASE_KEY_PASSWORD" \
            -alias "$ANDROID_RELEASE_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -dname "CN=SecondPart CI,O=SecondPart,C=GB"

      - name: Patch production Android release
        run: |
          node scripts/patch-android-production.mjs
          node scripts/patch-android-app-links.mjs

      - name: Configure CI Firebase placeholder
        run: node scripts/write-ci-google-services.mjs

      - name: Verify production-style configuration
        run: |
          node - <<'NODE'
          const fs=require("fs");
          const config=JSON.parse(fs.readFileSync("capacitor.config.json","utf8"));
          if(config.appId!=="com.secondpart.marketplace")throw new Error("Wrong production package.");
          if(config.android?.webContentsDebuggingEnabled!==false)throw new Error("Production WebView debugging is enabled.");
          if(config.loggingBehavior!=="none")throw new Error("Production logging is enabled.");
          if(config.server?.url!=="https://release-check.secondpart.invalid")throw new Error("Full production frontend URL was not preserved.");
          const vars=fs.readFileSync("android/variables.gradle","utf8");
          if(!/compileSdkVersion\s*=\s*36/.test(vars)||!/targetSdkVersion\s*=\s*36/.test(vars))throw new Error("API 36 not configured.");
          NODE

      - name: Build production-style Android App Bundle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Verify CI AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
